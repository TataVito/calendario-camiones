name: Respaldo semanal cifrado

# Cada domingo: copia completa de la base (esquema public + usuarios de Auth), cifrada con
# AES-256 usando la clave RESPALDO_CLAVE. Se guarda 90 días como artefacto del workflow.
# El repositorio es público: por eso el archivo va cifrado y solo se puede abrir con esa clave.
# Restaurar: gpg -d respaldo.sql.gpg > respaldo.sql  (pide la clave) y psql "<url>" -f respaldo.sql
# Fotos: gpg -d fotos-AAAA-MM-DD.tar.gz.gpg > fotos.tar.gz && tar -xzf fotos.tar.gz
on:
  schedule:
    - cron: '23 6 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  respaldo:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar secretos
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          CLAVE: ${{ secrets.RESPALDO_CLAVE }}
        run: |
          if [ -z "$DB_URL" ] || [ -z "$CLAVE" ]; then
            echo "::error::Faltan los secretos SUPABASE_DB_URL y/o RESPALDO_CLAVE (ver README)."
            exit 1
          fi

      - name: Instalar cliente PostgreSQL 17
        run: |
          sudo apt-get install -y -qq postgresql-common > /dev/null
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y > /dev/null
          sudo apt-get install -y -qq postgresql-client-17 > /dev/null

      - name: Volcar y cifrar
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          CLAVE: ${{ secrets.RESPALDO_CLAVE }}
        run: |
          set -euo pipefail
          umask 077
          fecha=$(TZ=America/Santiago date +%Y-%m-%d)
          {
            /usr/lib/postgresql/17/bin/pg_dump "$DB_URL" --schema=public --no-owner --no-privileges
            /usr/lib/postgresql/17/bin/pg_dump "$DB_URL" --data-only --table=auth.users --table=auth.identities
          } > respaldo.sql
          lineas=$(wc -l < respaldo.sql)
          echo "Volcado: $lineas líneas"
          test "$lineas" -gt 100
          gpg --batch --yes --pinentry-mode loopback --passphrase "$CLAVE" \
            --symmetric --cipher-algo AES256 -o "respaldo-$fecha.sql.gpg" respaldo.sql
          shred -u respaldo.sql
          echo "FECHA=$fecha" >> "$GITHUB_ENV"

      # Fotos de guías: requiere el secreto SUPABASE_SECRET_KEY (llave secreta de Supabase).
      # Si no está, el respaldo de datos sigue igual y solo se avisa.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
          path: repo
      - name: Respaldar y cifrar fotos de guías
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          CLAVE: ${{ secrets.RESPALDO_CLAVE }}
        run: |
          if [ -z "$SUPABASE_SECRET_KEY" ]; then
            echo "::warning::Falta el secreto SUPABASE_SECRET_KEY: las fotos no se respaldaron (ver README)."
            exit 0
          fi
          set -euo pipefail
          umask 077
          node repo/.github/scripts/respaldo-fotos.mjs
          mkdir -p fotos
          tar -czf fotos.tar.gz fotos
          gpg --batch --yes --pinentry-mode loopback --passphrase "$CLAVE"             --symmetric --cipher-algo AES256 -o "fotos-$FECHA.tar.gz.gpg" fotos.tar.gz
          rm -rf fotos fotos.tar.gz
          ls -la fotos-*.gpg

      - uses: actions/upload-artifact@v4
        with:
          name: respaldo-${{ env.FECHA }}
          path: |
            respaldo-*.sql.gpg
            fotos-*.tar.gz.gpg
          if-no-files-found: error
          retention-days: 90
